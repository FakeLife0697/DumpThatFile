<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Home - DumpThatFile </title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f9f9f9; }
        header { text-align: center; margin-bottom: 30px; }
        .file-upload { background: white; padding: 20px; border-radius: 8px; width: 50%; margin: auto; text-align: center; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; }
        button { padding: 10px 20px; background-color: #17a2b8; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #138496; }
    </style>
</head>
<body>
    <header>
        <h1> Welcome, User </h1>
        <p>Upload and manage your encrypted files securely</p>
    </header>    
    <div class="file-upload">
        <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" required />
            <br />
            <button type="submit">Upload File</button>
        </form>
    </div>
</body>
</html>
